[package]
name = "data-point-analysis"
version = "0.1.0"
edition = "2024"
authors = ["Amos amos_2025@163.com"]
description = "埋点数据分析系统"
license = "MIT"

[dependencies]
# 数据库操作=
clickhouse = {version = "0.14.1"}

# 异步执行
tokio = { version = "1.0", features = ["full"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.82"

# Kafka
kafka = { version = "0.10"}


# HTTP 服务 客户端

# redis
redis = { version = "1.0.0", features = ["connection-manager","r2d2", "tokio-comp"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.22"
rusqlite = { version = "0.29", features = ["bundled"] }

# 错误处理
thiserror = "1.0"

# 工具库
once_cell = "1.21.3"
anyhow = "1.0.51"
config = "0.13"
ctrlc = "3.5.1"
uuid = { version = "1.3", features = ["v4"] }
chrono = "0.4.23"
ua-parser = "0.2"
# 重试库
backon = "1.6.0"

# 日志库
log = "0.4.14"
env_logger = "0.9.0"
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["cors"] }
